version: '3.7'
services:
  its_hk_fe:
    container_name: its-system-fe
    image: its-system-fe
    build:
      dockerfile: Dockerfile
      context: .
      args:
        ACTIVE_PROFILE: ${ACTIVE_PROFILE:-stagging}
    #command: npm run start -- --dotenv .env.${ACTIVE_PROFILE}
    ports:
      - 60044:3000
    volumes:
      - ${UPLOAD_FOLDER:-/upload}:/src/static/upload